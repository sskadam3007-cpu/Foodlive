upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name foodlive.app www.foodlive.app; # Replace with your domain

    client_max_body_size 20M;

    # Let's Encrypt challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name foodlive.app www.foodlive.app;

    ssl_certificate /etc/letsencrypt/live/foodlive.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodlive.app/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/mediafiles/;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}